name: Build VoxMate APK

on:
  push:
    branches:
      - master
      - 'feat/**'
    paths-ignore:
      - 'README.md'
      - 'doc/**'
      - '.gitignore'
  workflow_dispatch:

jobs:
  build:
    name: Build VoxMate Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew and build script
        run: |
          chmod +x scripts/build-apk.sh
          chmod +x Android/src/gradlew

      - name: Build Debug APK
        run: |
          bash scripts/build-apk.sh

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoxMate-v0.1.0-3D-Avatar
          path: apk/VoxMate-v0.1.0-3D-Avatar.apk
          retention-days: 14
